<!--page {"title": "Track Order", "text": "Follow your cans from our packing table to your door. All you need is your order number and phone number."} -->
<!doctype html>
<html lang="en" class="no-js" data-layout="1">
<head>
<!--@head-->
</head>
<body data-page="track" class="page-track">
<!--@header-->

<!--@banner-->
<section class="orderpage">
  <div class="lookup lookup--wide">
    <h2>Where is my order?</h2>
    <p>Enter your order number (it looks like <b>DI-261018-AB7K</b>) and the mobile number you used at checkout.</p>
    <form class="lookup__form lookup__form--row" data-track-form novalidate>
      <div class="field"><label for="t-num">Order number</label><input class="input" id="t-num" name="number" placeholder="DI-XXXXXX-XXXX" autocomplete="off" required></div>
      <div class="field"><label for="t-phone">Mobile number</label><input class="input" id="t-phone" name="phone" type="tel" inputmode="tel" placeholder="01XXXXXXXXX" autocomplete="tel" required></div>
      <button class="btn" type="submit"><span>Track order</span></button>
    </form>
    <div class="form-note form-note--error" data-track-error hidden></div>
  </div>
  <div class="orderwrap" data-track-result></div>
</section>

<!--@cta-->
<!--@footer-->
<!--@scripts-->
</body>
</html>
